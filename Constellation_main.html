<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Notes — a constellation of ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ===========================================================
     INTERFACE COLORS — edit these to re-theme the chrome
     (panel, text, article view). The 3D scene's own colors
     live in the CONFIG object at the top of the <script> below.
  =========================================================== */
  :root{
    --bg:#07070a;
    --bg-deep:#000000;
    --ink:#e9e6df;
    --ink-dim:#8f8c88;
    --ink-faint:#565450;
    --line:#232227;
    --panel-bg:rgba(10,10,12,0.86);
    --panel-border:#2a292e;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg-deep);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #scene-wrap{
    position:fixed; inset:0;
    transition:opacity 1.1s cubic-bezier(.65,0,.35,1);
  }
  canvas#bg{ display:block; width:100%; height:100%; }

  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:
      radial-gradient(ellipse at 50% 44%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 28%, rgba(0,0,0,0.5) 62%, rgba(0,0,0,0.88) 92%, rgba(0,0,0,0.97) 100%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 55%);
  }
  #grain{
    position:fixed; inset:0; pointer-events:none; z-index:3;
    opacity:0.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  #brand{
    position:fixed; top:34px; left:38px; z-index:5;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--ink-dim);
    pointer-events:none;
  }
  #brand span{ color:var(--ink-faint); }

  #hint{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    z-index:5; font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink-faint);
    pointer-events:none;
    transition:opacity 0.6s ease;
  }

  /* floating info panel */
  #panel{
    position:fixed; z-index:6; width:280px;
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    backdrop-filter:blur(6px);
    padding:20px 22px 18px;
    pointer-events:none;
    opacity:0; transform:translateY(6px);
    transition:opacity 0.35s ease, transform 0.35s ease;
  }
  #panel.visible{ opacity:1; transform:translateY(0); }
  #panel .cat{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:0.16em; text-transform:uppercase;
    margin-bottom:10px;
  }
  #panel h3{
    font-family:'Fraunces', serif; font-weight:400; font-style:italic;
    font-size:22px; line-height:1.25; margin:0 0 10px 0; color:var(--ink);
  }
  #panel p{
    font-size:12.5px; line-height:1.6; color:var(--ink-dim);
    margin:0 0 14px 0;
  }
  #panel .meta{
    font-family:'IBM Plex Mono', monospace; font-size:10px;
    letter-spacing:0.06em; color:var(--ink-faint);
    display:flex; justify-content:space-between;
    border-top:1px solid var(--line); padding-top:10px;
  }

  /* article view */
  #article-view{
    position:fixed; inset:0; z-index:10;
    overflow-y:auto;
    background:var(--bg-deep);
    opacity:0; visibility:hidden;
    transition:opacity 0.9s cubic-bezier(.65,0,.35,1);
  }
  #article-view.visible{ opacity:1; visibility:visible; }
  #article-view::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.035) 0%, rgba(0,0,0,0) 55%);
  }
  .back-btn{
    position:fixed; top:36px; left:38px; z-index:11;
    background:none; border:none; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink-dim); padding:8px 0;
    display:flex; align-items:center; gap:8px;
    transition:color 0.25s ease;
  }
  .back-btn:hover{ color:var(--ink); }
  .back-btn svg{ width:13px; height:13px; }

  .article-column{
    max-width:700px; margin:0 auto; padding:150px 24px 160px;
  }
  .article-eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    letter-spacing:0.18em; text-transform:uppercase; margin-bottom:22px;
  }
  .article-title{
    font-family:'Fraunces', serif; font-weight:400; font-style:italic;
    font-size:44px; line-height:1.18; margin:0 0 22px 0; color:var(--ink);
  }
  .article-meta{
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    color:var(--ink-faint); letter-spacing:0.04em;
    padding-bottom:34px; margin-bottom:34px;
    border-bottom:1px solid var(--line);
  }
  .article-body p{
    font-size:17px; line-height:1.85; color:#cfccc5;
    margin:0 0 26px 0; font-weight:300;
  }
  .article-body p:first-of-type::first-letter{
    font-family:'Fraunces', serif; font-size:58px; font-weight:400;
    float:left; line-height:0.85; padding:8px 10px 0 0; color:var(--ink);
  }

  @media (max-width:640px){
    #brand{ top:22px; left:20px; font-size:10px; }
    #panel{ width:238px; padding:16px 18px 14px; }
    #panel h3{ font-size:18px; }
    .article-column{ padding:130px 22px 120px; }
    .article-title{ font-size:32px; }
    .article-body p{ font-size:16px; }
  }

  ::selection{ background:#3a3833; color:var(--ink); }
</style>
</head>
<body>

<div id="scene-wrap">
  <canvas id="bg"></canvas>
</div>
<div id="vignette"></div>
<div id="grain"></div>

<div id="brand">field notes <span>/ a constellation</span></div>
<div id="hint">drag to look around · scroll to move closer · click a star to read</div>

<div id="panel">
  <div class="cat" id="panel-cat"></div>
  <h3 id="panel-title"></h3>
  <p id="panel-desc"></p>
  <div class="meta">
    <span id="panel-date"></span>
    <span id="panel-time"></span>
  </div>
</div>

<div id="article-view">
  <button class="back-btn" id="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    constellation
  </button>
  <div class="article-column" id="article-column"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

/* ===========================================================================
   CONFIG
   Everything you're likely to want to tune — colors, speeds, sizes, timings —
   lives here. The rendering code below just reads these values, so you
   should rarely need to touch anything past the ARTICLES list.
=========================================================================== */
var CONFIG = {

  /* One entry per category. `color` accepts any CSS hex string.
     Add a category here, then use its key as `cat` on an article below. */
  categories: {
    physics:  { label:'Physics & Cosmos',        color:'#9bd4c9' },
    math:     { label:'Mathematics',              color:'#b0ace3' },
    ir:       { label:'International Relations',  color:'#e0aec0' },
    web:      { label:'Web & Systems',             color:'#acd89a' },
    robotics: { label:'Robotics & Hardware',       color:'#f3bd82' }
  },

  /* Camera + orbit controls */
  scene: {
    fov: 46,
    homeTheta: 0.35,          // starting horizontal angle (radians)
    homePhi: 1.25,            // starting vertical angle (radians)
    homeRadius: 18,           // starting distance from center — bigger = more zoomed out
    zoomMin: 6,
    zoomMax: 26,
    dragRotateSpeed: 0.0045,
    dragTiltSpeed: 0.0035,
    wheelZoomSpeed: 0.012,
    idleRotateSpeed: 0.028,   // how fast the constellation slowly turns on its own
    idleResumeDelay: 2600,    // ms of no interaction before auto-rotate resumes
    followEase: 0.08          // how quickly the camera eases toward target each frame (0-1)
  },

  /* Background starfield */
  starfield: {
    far:  { count:450, spread:90, size:0.10, opacity:0.40 },
    near: { count:120, spread:40, size:0.14, opacity:0.55 },
    driftSpeed: 0.0025
  },

  /* Occasional shooting star */
  shootingStar: {
    minDelay: 10000,          // ms between meteors, minimum
    maxDelay: 28000,          // ms between meteors, maximum
    speedMin: 9, speedMax: 15,
    lifetimeMin: 1.1, lifetimeMax: 1.7,
    trailLengthMin: 3.5, trailLengthMax: 6.5,
    lineOpacity: 0.8,
    glowOpacity: 0.55
  },

  /* Node (star) appearance + hover behaviour */
  nodes: {
    sphereRadius: 6.6,           // radius of the golden-angle placement sphere
    radiusJitterMin: 0.72,       // inner bound of per-node depth jitter
    radiusJitterRange: 0.42,     // spread of per-node depth jitter
    baseSizeMin: 0.12,           // core sphere radius at importance 0.5
    baseSizeScale: 0.1,          // extra radius per unit of importance above 0.5
    glowScaleMultiplier: 8,
    ringScaleMultiplier: 5.4,
    baseGlowOpacity: 0.3,
    baseRingOpacity: 0.22,
    hoverScaleMultiplier: 1.9,
    hoverGlowMultiplier: 2.6,
    hoverRingMultiplier: 3.2,
    halfLitGlowMultiplier: 1.7,   // boost when a node's connecting line (not the node) is hovered
    halfLitRingMultiplier: 1.9,
    connectedGlowMultiplier: 1.3, // boost for nodes connected to the hovered node
    connectedRingMultiplier: 1.4,
    restOpacity: 0.95,
    hoverOpacity: 1,
    connectedOpacity: 0.75,
    dimmedOpacity: 0.28,
    easeSpeed: 0.15
  },

  /* Connecting lines between nodes */
  edges: {
    nearestNeighbors: 2,          // each node auto-connects to its N closest neighbours
    extraCrossings: [[0,7],[2,10],[4,12],[1,9]], // extra long lines, by article index — for visual interest
    color: 0xffffff,
    restOpacity: 0.1,
    hoverConnectedOpacity: 0.85,
    hoverLineOpacity: 1,
    dimmedOpacity: 0.025,
    easeSpeed: 0.15
  },

  /* Camera flight into an article */
  warp: {
    duration: 1100,              // ms
    endDistanceMultiplier: 1.9   // how far past the node the camera flies before the article appears
  }
};

/* ===========================================================================
   ARTICLES
   One object per node. Add, remove, or edit freely — the constellation
   rebuilds itself from this list. Fields:
     id         unique slug
     cat        must match a key in CONFIG.categories
     importance 0.5 = average size; higher = a bigger, more prominent star
     title      shown in the panel + article header
     desc       one-line teaser shown in the hover panel
     date       display string
     readTime   minutes, shown in panel + article header
     body       array of paragraphs (plain strings)
=========================================================================== */
var ARTICLES = [
  { id:'wavefunctions', cat:'physics', importance:1.35,
    title:'From Wavefunctions to Fireballs',
    desc:'How the calm mathematics of Schrödinger\'s equation ends, several layers down, in a plasma hot enough to melt protons.',
    date:'11 Feb 2026', readTime:9,
    body:[
      'There is a strange comfort in the Schrödinger equation. It is linear, it is deterministic, and for a first year it behaves. You solve the infinite square well, you solve the harmonic oscillator, and the universe feels briefly tidy — a wavefunction evolving smoothly through Hilbert space, probabilities conserved, nothing lost.',
      'Then you meet the Heisenberg Uncertainty Principle properly, not as a slogan about not knowing things, but as a statement about which pairs of questions a physical system is even allowed to answer at once. Position and momentum are not secrets the electron is keeping from you. They are quantities that cannot simultaneously have sharp values, full stop. That reframing — from ignorance to incompatibility — is the hinge the rest of the piece turns on.',
      'From there the essay follows a single thread down through the Standard Model, through colour charge and the strange non-abelian bookkeeping of the strong force, and finally into the quark-gluon plasma: a state of matter recreated for microseconds at RHIC and in ALICE at CERN, where confinement itself briefly fails and quarks stop pretending to live inside protons. The wavefunction you started with is still in there somewhere. It is just very, very busy.'
    ]},

  { id:'uncertainty', cat:'physics', importance:0.85,
    title:'Reading the Uncertainty Principle Literally',
    desc:'A short defence of taking Δx·Δp ≥ ħ/2 at face value instead of reaching for the usual observer-effect analogy.',
    date:'2 Mar 2026', readTime:6,
    body:[
      'Most first explanations of the uncertainty principle reach for a measurement story: shine a photon at an electron to see it, and the photon kicks the electron, disturbing the very momentum you were trying to read. It is a serviceable analogy and it is also, on its own, misleading — it suggests the electron secretly has a precise position and momentum that clumsy human instruments simply fail to catch.',
      'The commutator formulation says something sharper. Position and momentum operators do not commute, and that algebraic fact alone forces a lower bound on the product of their spreads, independent of any experiment or observer. The uncertainty is not epistemic. It is built into what "having a value" means for a quantum system.',
      'Once that distinction lands, a lot of downstream physics stops feeling like a collection of odd rules and starts feeling like consequences of one structural fact about non-commuting observables — energy-time uncertainty, zero-point energy, even the stability of atoms against collapse.'
    ]},

  { id:'alice', cat:'physics', importance:0.7,
    title:'What ALICE Saw at CERN',
    desc:'Notes on the experimental signatures used to infer a quark-gluon plasma existed at all, since nobody can point a camera at it.',
    date:'22 Mar 2026', readTime:5,
    body:[
      'You cannot photograph a quark-gluon plasma. It exists for something on the order of 10⁻²³ seconds inside a heavy-ion collision, well below anything a detector could resolve directly. Everything known about it is inferred, indirectly, from the debris.',
      'ALICE looks for a handful of signatures: the suppression of certain high-momentum particles that should have punched straight through ordinary matter but instead lose energy ploughing through a denser, deconfined medium; an enhancement in strange-quark production, which is easier to make when quarks are already running loose; and collective flow patterns in the spray of final particles that only make sense if the matter behaved, briefly, like a fluid.',
      'None of these alone is proof. Together, converging from independent directions, they are the closest physics gets to a fingerprint of something it will never directly see.'
    ]},

  { id:'subsets', cat:'math', importance:1.3,
    title:'Counting Subsets Without Counting',
    desc:'Three independent proofs that a set of size n has exactly 2ⁿ subsets — combinatorial, inductive, and via the Boolean lattice.',
    date:'14 Jan 2026', readTime:8,
    body:[
      'The formula |𝒫(A)| = 2ⁿ is the kind of result you can believe immediately and still spend a satisfying afternoon actually proving. The fastest route is combinatorial: building a subset is n independent yes/no decisions, one per element, and the multiplication principle does the rest.',
      'The inductive route is slower and more honest about why the formula holds. Assume it for a set of size k, then add one new element: every existing subset either includes the newcomer or it does not, exactly doubling the count. It is induction as a ladder rather than a leap — each rung load-bearing, nothing skipped.',
      'The third route is the most visual: draw the Hasse diagram of the subsets of a small set ordered by inclusion, and the power set reveals itself as a Boolean lattice — the n-cube, essentially, with 2ⁿ vertices. Three proofs, three different reasons to trust the same number.'
    ]},

  { id:'induction', cat:'math', importance:0.75,
    title:'Induction as a Ladder, Not a Leap',
    desc:'Why the inductive step is best understood as a machine for climbing, not a single clever jump from one case to all cases.',
    date:'28 Jan 2026', readTime:5,
    body:[
      'Mathematical induction gets taught as two steps — base case, inductive step — but the metaphor that actually sticks is a ladder. The base case is the first rung. The inductive step is not a leap to the top; it is a promise that whichever rung you are standing on, you can always reach the next one.',
      'That reframing matters because the failure modes of induction are almost always failures of the ladder, not the leap. An inductive step that secretly assumes something true only for small n, or that quietly changes the structure being climbed partway up, will collapse the argument even if the base case and the "leap" both look fine in isolation.',
      'Once you start checking induction proofs rung by rung instead of trusting the shape of the argument, a surprising number of classic fallacious proofs — the ones where every horse is supposedly the same colour — become easy to catch.'
    ]},

  { id:'lattices', cat:'math', importance:0.6,
    title:'Boolean Lattices and the Shape of Choice',
    desc:'The power set of a finite set, drawn as a diagram, turns out to have the same shape as a hypercube.',
    date:'9 Feb 2026', readTime:4,
    body:[
      'Draw every subset of {a, b, c} as a node, connect two nodes if one subset is obtained from the other by adding a single element, and something unexpected appears: a cube. Not metaphorically — the diagram is literally the edge graph of a 3-cube, with the empty set at one corner and the full set at the opposite one.',
      'This is the Boolean lattice, and it generalises cleanly: the subsets of an n-element set, ordered by inclusion, form the n-dimensional hypercube. Every property of the hypercube you can find — its symmetry group, its diameter, the number of edges — translates directly into a statement about how subsets relate to each other.',
      'It is a small piece of evidence for a bigger pattern in mathematics: counting problems and combinatorial structures keep turning out to be geometry wearing a different coat.'
    ]},

  { id:'freeze-date', cat:'ir', importance:1.1,
    title:'Freeze Dates and False Anachronisms',
    desc:'In a historical crisis committee, the sharpest weapon is not a stronger argument — it is a source your opponent forgot did not exist yet.',
    date:'19 Apr 2026', readTime:7,
    body:[
      'Every historical Model UN committee is built around a freeze date, the fictional moment at which the simulation begins and everything after becomes unwritten. The discipline this demands is unglamorous and almost entirely invisible to anyone not doing it: knowing, instrument by instrument, exactly which treaties, protocols, and doctrines were legally binding on that date, and which were still years away.',
      'This matters more than it sounds. A delegate who cites an instrument that postdates the freeze — reaching for language that sounds authoritative but was not yet law — has handed the room a gift. The correction does not just neutralise the argument; it signals, to everyone watching, that the rest of that delegation\'s legal arsenal deserves scrutiny too.',
      'Preparing for this kind of committee is less like writing an essay and more like building a minefield: a legal dossier is only as useful as the traps it lets you set for delegations that have not done the same chronological homework.'
    ]},

  { id:'montreux', cat:'ir', importance:0.95,
    title:'The Montreux Convention as a Weapon',
    desc:'A 1936 treaty about who may sail through the Turkish Straits, repurposed as the leverage point of an entire crisis strategy.',
    date:'3 May 2026', readTime:6,
    body:[
      'The Montreux Convention of 1936 is not, on its face, dramatic reading. It governs the passage of warships through the Bosphorus and the Dardanelles, granting Turkey control over naval transit between the Black Sea and the Mediterranean, with different rules for Black Sea and non-Black Sea powers.',
      'In a Cold War crisis committee, that dry procedural fact becomes a chokepoint in the most literal sense — a legal lever capable of stranding a fleet, delaying a resupply, or forcing an adversary to route around an entire sea. The strength of building a strategy on an instrument like this is that almost nobody else in the room has read it closely enough to contest it.',
      'The lesson generalises past any one committee: the most powerful clause in a negotiation is rarely the one everyone is already arguing about.'
    ]},

  { id:'crossfire', cat:'ir', importance:0.55,
    title:'Building a Crossfire Question Bank',
    desc:'Preparing thirty delegation-specific questions in advance turns crossfire from improvisation into a rehearsed offensive.',
    date:'27 May 2026', readTime:4,
    body:[
      'Crossfire rewards delegates who look spontaneous, but the ones who are actually winning it rarely are. Behind a good crossfire performance is usually a question bank built weeks earlier — one entry per opposing delegation, grounded in that country\'s documented historical position and, ideally, a specific violation or contradiction only a handful of people in the room will have researched.',
      'The bank is not meant to be recited verbatim. It is scaffolding: a question you already know the shape of the honest answer to, so you can listen for the moment a delegate drifts from it and follow up in real time.',
      'Done well, this turns crossfire from a test of quick thinking into a test of preparation wearing quick thinking as a costume — which, most of the time, is a fair description of good diplomacy generally.'
    ]},

  { id:'personal-galaxy', cat:'web', importance:0.9,
    title:'A Personal Galaxy, in One HTML File',
    desc:'On building a self-contained personal site — blog, garden, and portfolio — as a single file with no build step and no dependencies to rot.',
    date:'6 Jun 2026', readTime:6,
    body:[
      'There is something appealing about a website that is also a single file. No build step, no framework version to fall out of date, no dependency tree to audit two years from now. Just markup, a stylesheet, and enough JavaScript to make it feel alive, all sitting in one document you could email to yourself.',
      'The trade-off is discipline: everything has to earn its place, because there is no folder structure to hide complexity in. A dark theme, a particle background, an admin view, a digital garden of half-finished notes — each of those has to be built plainly enough that the whole file stays legible six months later.',
      'The reward is durability. A single self-contained file is close to the most future-proof format a personal site can take — it will still open, unmodified, long after whatever hosting platform seemed permanent at the time has changed its pricing twice.'
    ]},

  { id:'discovery', cat:'web', importance:0.65,
    title:'Designing for Discovery Instead of Scroll',
    desc:'What changes when a blog\'s primary navigation is spatial exploration rather than a reverse-chronological list.',
    date:'19 Jun 2026', readTime:5,
    body:[
      'A reverse-chronological list is an honest interface — it tells you exactly what it is optimising for, which is recency. But recency is a strange thing to optimise a personal blog around, when half the appeal of going back through old writing is bumping into something you had forgotten you thought.',
      'A spatial layout changes the implicit question the homepage is asking. Instead of "what did I write most recently," it asks "what is near what," which forces categories and relationships to become visible in a way a list simply cannot show. Two posts written eight months apart can sit next to each other if the ideas are adjacent.',
      'The risk is discoverability for its own sake, style outrunning function. The fix, in practice, has been to keep the spatial layer thin — one clear axis of meaning (category, importance) per visual property — so exploration feels like a shortcut to relevant ideas, not a puzzle standing in front of them.'
    ]},

  { id:'actuators', cat:'robotics', importance:0.8,
    title:'Actuators, Latency, and Trust',
    desc:'A small delay between command and motion is a physics problem. Left unaddressed, it becomes a trust problem.',
    date:'30 Jun 2026', readTime:5,
    body:[
      'Every actuator has a gap between being told to move and actually moving — friction to overcome, current to ramp, a control loop that needs a few cycles to settle. In isolation, a few milliseconds of latency is a footnote in a datasheet.',
      'Stack several of those gaps together, across several joints, and the footnote becomes something a person operating the system can feel: a sluggishness that reads less like "the motor is slow" and more like "the machine is not quite listening." That perceptual jump — from a timing spec to a feeling of unresponsiveness — is where a lot of otherwise well-engineered robotics projects lose the confidence of whoever is using them.',
      'Closing that gap is partly a hardware problem and partly a communication one: even a system that cannot be made faster can be made to feel more trustworthy simply by acknowledging a command instantly and letting the motion catch up a moment later.'
    ]},

  { id:'sensors', cat:'robotics', importance:0.5,
    title:'Sensors That Lie a Little',
    desc:'No sensor tells the truth exactly. Good hardware design is mostly deciding how much of a lie is acceptable, and where.',
    date:'9 Jul 2026', readTime:4,
    body:[
      'It is tempting to treat a sensor reading as ground truth simply because it is a number rather than an opinion. In practice every sensor is a translator with an accent: an ultrasonic rangefinder that struggles with soft or angled surfaces, an IMU that drifts a little further from reality with every second it goes uncorrected, a cheap photoresistor that reports light level with a curve nobody bothered to linearise.',
      'None of this makes the sensor useless. It makes the honest question not "is this reading correct" but "in which direction, and under which conditions, is this reading wrong" — and then designing the rest of the system around that specific, predictable dishonesty rather than an idealised one.',
      'The best hardware projects tend to be the ones where every sensor\'s particular lie has been catalogued in advance, rather than discovered live, in front of a judging panel.'
    ]}
];

/* ===========================================================================
   IMPLEMENTATION — shouldn't need to touch anything below this line
=========================================================================== */
function cat(id){ return CONFIG.categories[id]; }

/* --- renderer / scene / camera --- */
var canvas = document.getElementById('bg');
var renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x07070a, 1);

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(CONFIG.scene.fov, window.innerWidth/window.innerHeight, 0.1, 200);

/* --- orbit rig (spherical camera controls, custom + light) --- */
var rig = { theta: CONFIG.scene.homeTheta, phi: CONFIG.scene.homePhi, radius: CONFIG.scene.homeRadius };
var HOME = { theta: CONFIG.scene.homeTheta, phi: CONFIG.scene.homePhi, radius: CONFIG.scene.homeRadius };
var targetRig = { theta: rig.theta, phi: rig.phi, radius: rig.radius };

function updateCameraFromRig(){
  var t = rig.theta, p = Math.max(0.35, Math.min(Math.PI-0.35, rig.phi)), r = rig.radius;
  camera.position.set(
    r * Math.sin(p) * Math.sin(t),
    r * Math.cos(p),
    r * Math.sin(p) * Math.cos(t)
  );
  camera.lookAt(0,0,0);
}
updateCameraFromRig();

/* --- starfield --- */
function makeStarfield(count, spread, size, opacity){
  var geo = new THREE.BufferGeometry();
  var pos = new Float32Array(count*3);
  for(var i=0;i<count;i++){
    var r = spread * (0.35 + Math.random()*0.65);
    var th = Math.random()*Math.PI*2;
    var ph = Math.acos((Math.random()*2)-1);
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.sin(ph)*Math.sin(th);
    pos[i*3+2] = r*Math.cos(ph);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  var mat = new THREE.PointsMaterial({ color:0xffffff, size:size, sizeAttenuation:true, transparent:true, opacity:opacity, depthWrite:false });
  return new THREE.Points(geo, mat);
}
var starsFar = makeStarfield(CONFIG.starfield.far.count, CONFIG.starfield.far.spread, CONFIG.starfield.far.size, CONFIG.starfield.far.opacity);
var starsNear = makeStarfield(CONFIG.starfield.near.count, CONFIG.starfield.near.spread, CONFIG.starfield.near.size, CONFIG.starfield.near.opacity);
scene.add(starsFar); scene.add(starsNear);

/* --- glow + ring-halo textures --- */
function makeGlowTexture(){
  var size=128, c=document.createElement('canvas'); c.width=c.height=size;
  var ctx=c.getContext('2d');
  var g=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.35,'rgba(255,255,255,0.5)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
function makeRingTexture(){
  var size=256, c=document.createElement('canvas'); c.width=c.height=size;
  var ctx=c.getContext('2d');
  ctx.translate(size/2,size/2);
  ctx.strokeStyle='rgba(255,255,255,1)';
  ctx.lineWidth=5;
  ctx.shadowColor='rgba(255,255,255,0.9)';
  ctx.shadowBlur=10;
  ctx.beginPath();
  ctx.arc(0,0,size*0.34,0,Math.PI*2);
  ctx.stroke();
  return new THREE.CanvasTexture(c);
}
var glowTex = makeGlowTexture();
var ringTex = makeRingTexture();

/* --- occasional shooting star --- */
function makeShootingStar(){
  var SS = CONFIG.shootingStar;
  var segs = 10;
  var trailLength = SS.trailLengthMin + Math.random()*(SS.trailLengthMax-SS.trailLengthMin);
  var startRadius = 16 + Math.random()*10;
  var theta = Math.random()*Math.PI*2;
  var phi = Math.PI*0.22 + Math.random()*Math.PI*0.56;
  var start = new THREE.Vector3(
    startRadius*Math.sin(phi)*Math.cos(theta),
    startRadius*Math.cos(phi),
    startRadius*Math.sin(phi)*Math.sin(theta)
  );
  var dir = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();

  var positions = new Float32Array((segs+1)*3);
  var colors = new Float32Array((segs+1)*3);
  var head = new THREE.Color(0xffffff);
  var tail = new THREE.Color(0x000000);
  for(var s=0;s<=segs;s++){
    var f = s/segs;
    positions[s*3]   = -dir.x*f*trailLength;
    positions[s*3+1] = -dir.y*f*trailLength;
    positions[s*3+2] = -dir.z*f*trailLength;
    var col = head.clone().lerp(tail, f);
    colors[s*3]=col.r; colors[s*3+1]=col.g; colors[s*3+2]=col.b;
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  var mat = new THREE.LineBasicMaterial({ vertexColors:true, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
  var line = new THREE.Line(geo, mat);

  var headGlowMat = new THREE.SpriteMaterial({ map:glowTex, color:0xffffff, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
  var headGlow = new THREE.Sprite(headGlowMat);
  headGlow.scale.set(0.5,0.5,1);

  var group = new THREE.Group();
  group.position.copy(start);
  group.add(line);
  group.add(headGlow);

  return {
    group:group, mat:mat, glowMat:headGlowMat, dir:dir,
    speed: SS.speedMin + Math.random()*(SS.speedMax-SS.speedMin),
    age:0,
    lifetime: SS.lifetimeMin + Math.random()*(SS.lifetimeMax-SS.lifetimeMin)
  };
}
var shootingStars = [];
function spawnShootingStar(){
  var s = makeShootingStar();
  scene.add(s.group);
  shootingStars.push(s);
}
function scheduleNextShootingStar(){
  var SS = CONFIG.shootingStar;
  var delay = SS.minDelay + Math.random()*(SS.maxDelay-SS.minDelay);
  setTimeout(function(){ spawnShootingStar(); scheduleNextShootingStar(); }, delay);
}
scheduleNextShootingStar();

/* --- golden-angle (fibonacci sphere) node placement ---
   Depth jitter uses a golden-ratio low-discrepancy sequence (rather than
   plain Math.random) so nodes spread out evenly at every radius instead
   of clumping — same principle as the golden-angle placement itself. */
var N = ARTICLES.length;
var GOLDEN_ANGLE = Math.PI*(3-Math.sqrt(5));
var GOLDEN_RATIO_CONJUGATE = 0.6180339887498949;
function frac(x){ return x - Math.floor(x); }

var nodeGroup = new THREE.Group();
var lineGroup = new THREE.Group();
scene.add(lineGroup); scene.add(nodeGroup);

var nodes = []; // {data, core, glow, ring, position, ...}
var NC = CONFIG.nodes;

for(var i=0;i<N;i++){
  var yFrac = 1 - (i/(N-1))*2;
  var rAtY = Math.sqrt(Math.max(0,1-yFrac*yFrac));
  var theta = GOLDEN_ANGLE*i;
  var jitter = NC.radiusJitterMin + NC.radiusJitterRange * frac(i*GOLDEN_RATIO_CONJUGATE + 0.5);
  var baseR = NC.sphereRadius * jitter;
  var pos = new THREE.Vector3(
    Math.cos(theta)*rAtY*baseR,
    yFrac*baseR,
    Math.sin(theta)*rAtY*baseR
  );

  var data = ARTICLES[i];
  var c = cat(data.cat);
  var scale = NC.baseSizeMin + NC.baseSizeScale*(data.importance-0.5);

  var coreGeo = new THREE.SphereGeometry(scale, 20, 20);
  var coreMat = new THREE.MeshBasicMaterial({ color:c.color, transparent:true, opacity:NC.restOpacity });
  var core = new THREE.Mesh(coreGeo, coreMat);
  core.position.copy(pos);

  var glowMat = new THREE.SpriteMaterial({ map:glowTex, color:c.color, transparent:true, opacity:NC.baseGlowOpacity, blending:THREE.AdditiveBlending, depthWrite:false });
  var glow = new THREE.Sprite(glowMat);
  var glowScale = scale*NC.glowScaleMultiplier;
  glow.scale.set(glowScale, glowScale, 1);
  glow.position.copy(pos);

  var ringMatN = new THREE.SpriteMaterial({ map:ringTex, color:c.color, transparent:true, opacity:NC.baseRingOpacity, blending:THREE.AdditiveBlending, depthWrite:false });
  var ringSprite = new THREE.Sprite(ringMatN);
  var ringScale = scale*NC.ringScaleMultiplier;
  ringSprite.scale.set(ringScale, ringScale, 1);
  ringSprite.position.copy(pos);

  nodeGroup.add(glow);
  nodeGroup.add(ringSprite);
  nodeGroup.add(core);

  nodes.push({
    data:data, core:core, glow:glow, ring:ringSprite, position:pos,
    baseScale:scale, baseGlowOpacity:NC.baseGlowOpacity, baseGlowScale:glowScale,
    baseRingOpacity:NC.baseRingOpacity, baseRingScale:ringScale
  });
}

/* --- edges: connect each node to its nearest neighbours + a few long crossings --- */
var EC = CONFIG.edges;
var edgeSet = {};
function edgeKey(a,b){ return a<b ? a+'-'+b : b+'-'+a; }
var edges = [];

function addEdge(ai,bi){
  var k = edgeKey(ai,bi);
  if(edgeSet[k]) return;
  edgeSet[k]=true;
  var mat = new THREE.LineBasicMaterial({ color:EC.color, transparent:true, opacity:EC.restOpacity });
  var geo = new THREE.BufferGeometry().setFromPoints([nodes[ai].position, nodes[bi].position]);
  var line = new THREE.Line(geo, mat);
  lineGroup.add(line);
  edges.push({ a:ai, b:bi, line:line, mat:mat });
}

for(var i2=0;i2<N;i2++){
  var dists = [];
  for(var j2=0;j2<N;j2++){
    if(i2===j2) continue;
    dists.push({ j:j2, d:nodes[i2].position.distanceTo(nodes[j2].position) });
  }
  dists.sort(function(a,b){ return a.d-b.d; });
  for(var k2=0; k2<EC.nearestNeighbors && k2<dists.length; k2++){
    addEdge(i2, dists[k2].j);
  }
}
EC.extraCrossings.forEach(function(pair){
  if(pair[0]<N && pair[1]<N) addEdge(pair[0], pair[1]);
});

/* neighbour map for hover highlighting */
var neighborEdges = {};
edges.forEach(function(e, idx){
  neighborEdges[e.a] = neighborEdges[e.a] || [];
  neighborEdges[e.a].push(idx);
  neighborEdges[e.b] = neighborEdges[e.b] || [];
  neighborEdges[e.b].push(idx);
});
var hoveredEdge = null;

/* ---------------------------------------------------------
   INTERACTION: drag to orbit, wheel to zoom, hover raycast
--------------------------------------------------------- */
var SC = CONFIG.scene;
var isDragging = false, lastX=0, lastY=0, dragMoved=false;
var idleRotate = true;
var idleTimer = null;

function onDown(x,y){
  isDragging = true; dragMoved=false; lastX=x; lastY=y; idleRotate=false;
}
function onMove(x,y){
  if(!isDragging) return;
  var dx = x-lastX, dy = y-lastY;
  if(Math.abs(dx)>2 || Math.abs(dy)>2) dragMoved=true;
  targetRig.theta -= dx*SC.dragRotateSpeed;
  targetRig.phi   -= dy*SC.dragTiltSpeed;
  targetRig.phi = Math.max(0.5, Math.min(Math.PI-0.5, targetRig.phi));
  lastX=x; lastY=y;
}
function onUp(){
  isDragging=false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function(){ idleRotate = true; }, SC.idleResumeDelay);
}

canvas.addEventListener('mousedown', function(e){ onDown(e.clientX, e.clientY); });
window.addEventListener('mousemove', function(e){ onMove(e.clientX, e.clientY); updateMouseForRaycast(e.clientX, e.clientY); });
window.addEventListener('mouseup', onUp);

canvas.addEventListener('touchstart', function(e){ var t=e.touches[0]; onDown(t.clientX, t.clientY); }, {passive:true});
canvas.addEventListener('touchmove', function(e){ var t=e.touches[0]; onMove(t.clientX, t.clientY); updateMouseForRaycast(t.clientX, t.clientY); }, {passive:true});
canvas.addEventListener('touchend', onUp);

canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  targetRig.radius += e.deltaY*SC.wheelZoomSpeed;
  targetRig.radius = Math.max(SC.zoomMin, Math.min(SC.zoomMax, targetRig.radius));
  clearTimeout(idleTimer); idleRotate=false;
  idleTimer = setTimeout(function(){ idleRotate = true; }, SC.idleResumeDelay);
}, { passive:false });

var raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.2;
raycaster.params.Line.threshold = 0.12;
var mouseNDC = new THREE.Vector2(999,999);
function updateMouseForRaycast(cx, cy){
  mouseNDC.x = (cx/window.innerWidth)*2-1;
  mouseNDC.y = -(cy/window.innerHeight)*2+1;
}

var hovered = null;
var panel = document.getElementById('panel');
var panelCat = document.getElementById('panel-cat');
var panelTitle = document.getElementById('panel-title');
var panelDesc = document.getElementById('panel-desc');
var panelDate = document.getElementById('panel-date');
var panelTime = document.getElementById('panel-time');

function setHover(idx){
  if(hovered===idx) return;
  hovered = idx;
  if(idx===null){
    panel.classList.remove('visible');
    document.body.style.cursor='default';
    return;
  }
  var n = nodes[idx];
  var c = cat(n.data.cat);
  panelCat.textContent = c.label;
  panelCat.style.color = c.color;
  panelTitle.textContent = n.data.title;
  panelDesc.textContent = n.data.desc;
  panelDate.textContent = n.data.date;
  panelTime.textContent = n.data.readTime + ' min read';
  panel.classList.add('visible');
  document.body.style.cursor='pointer';
}

function positionPanel(idx){
  if(idx===null) return;
  var n = nodes[idx];
  var v = n.position.clone().project(camera);
  var x = (v.x*0.5+0.5)*window.innerWidth;
  var y = (-v.y*0.5+0.5)*window.innerHeight;
  var px = x+26, py = y-40;
  var pw = panel.offsetWidth || 280, ph = panel.offsetHeight || 160;
  if(px+pw > window.innerWidth-16) px = x-pw-26;
  if(py+ph > window.innerHeight-16) py = window.innerHeight-ph-16;
  if(py < 16) py = 16;
  panel.style.left = px+'px';
  panel.style.top = py+'px';
}

canvas.addEventListener('click', function(){
  if(dragMoved) return; // was a drag, not a click
  if(hovered!==null && !warping){
    goToArticle(hovered);
  }
});

/* ---------------------------------------------------------
   WARP TRANSITION + ARTICLE VIEW
--------------------------------------------------------- */
var warping = false;
var articleView = document.getElementById('article-view');
var articleColumn = document.getElementById('article-column');
var sceneWrap = document.getElementById('scene-wrap');
var hint = document.getElementById('hint');
var backBtn = document.getElementById('back-btn');

function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

function goToArticle(idx){
  warping = true;
  setHover(null);
  hint.style.opacity = '0';
  var n = nodes[idx];
  var startPos = camera.position.clone();
  var startTarget = new THREE.Vector3(0,0,0);
  var endPos = n.position.clone().multiplyScalar(CONFIG.warp.endDistanceMultiplier);
  var duration = CONFIG.warp.duration, start = null;

  function step(ts){
    if(!start) start = ts;
    var t = Math.min(1, (ts-start)/duration);
    var e = easeInOutCubic(t);
    camera.position.lerpVectors(startPos, endPos, e);
    camera.lookAt(n.position.clone().lerp(startTarget, 1-e*0.3));
    var fade = 1-e;
    sceneWrap.style.opacity = fade.toString();
    if(t<1){ requestAnimationFrame(step); }
    else { openArticle(idx); }
  }
  requestAnimationFrame(step);
}

function openArticle(idx){
  var n = nodes[idx].data;
  var c = cat(n.cat);
  articleColumn.innerHTML =
    '<div class="article-eyebrow" style="color:'+c.color+'">'+c.label+'</div>'+
    '<h1 class="article-title">'+n.title+'</h1>'+
    '<div class="article-meta">'+n.date+' &nbsp;·&nbsp; '+n.readTime+' min read</div>'+
    '<div class="article-body">'+n.body.map(function(p){ return '<p>'+p+'</p>'; }).join('')+'</div>';
  articleView.classList.add('visible');
  articleView.scrollTop = 0;
  sceneWrap.style.pointerEvents = 'none';
}

function closeArticle(){
  articleView.classList.remove('visible');
  sceneWrap.style.opacity = '1';
  sceneWrap.style.pointerEvents = 'auto';
  targetRig.theta = HOME.theta; targetRig.phi = HOME.phi; targetRig.radius = HOME.radius;
  setTimeout(function(){
    hint.style.opacity = '1';
    warping = false;
  }, 500);
}
backBtn.addEventListener('click', closeArticle);

/* ---------------------------------------------------------
   ANIMATE
--------------------------------------------------------- */
var clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  var dt = clock.getDelta();

  if(idleRotate && !warping){
    targetRig.theta += dt*SC.idleRotateSpeed;
  }
  rig.theta += (targetRig.theta-rig.theta)*SC.followEase;
  rig.phi   += (targetRig.phi-rig.phi)*SC.followEase;
  rig.radius+= (targetRig.radius-rig.radius)*SC.followEase;

  if(!warping){
    updateCameraFromRig();
  }

  starsFar.rotation.y += dt*CONFIG.starfield.driftSpeed;

  for(var si=shootingStars.length-1; si>=0; si--){
    var st = shootingStars[si];
    st.age += dt;
    var lifeFrac = st.age/st.lifetime;
    if(lifeFrac>=1){
      scene.remove(st.group);
      shootingStars.splice(si,1);
      continue;
    }
    st.group.position.addScaledVector(st.dir, st.speed*dt);
    var op;
    if(lifeFrac<0.12) op = lifeFrac/0.12;
    else if(lifeFrac>0.5) op = 1-((lifeFrac-0.5)/0.5);
    else op = 1;
    op = Math.max(0, Math.min(1, op));
    st.mat.opacity = op*CONFIG.shootingStar.lineOpacity;
    st.glowMat.opacity = op*CONFIG.shootingStar.glowOpacity;
  }

  /* hover raycast (skip while warping) */
  if(!warping){
    raycaster.setFromCamera(mouseNDC, camera);
    var coreMeshes = nodes.map(function(n){ return n.core; });
    var hits = raycaster.intersectObjects(coreMeshes);
    if(hits.length){
      var idx = coreMeshes.indexOf(hits[0].object);
      setHover(idx);
      hoveredEdge = null;
    } else {
      setHover(null);
      var lineObjs = edges.map(function(e){ return e.line; });
      var lineHits = raycaster.intersectObjects(lineObjs);
      hoveredEdge = lineHits.length ? lineObjs.indexOf(lineHits[0].object) : null;
    }
  }

  /* per-node visual state: hovered grows/brightens, connected lines glow, unrelated fade */
  var activeEdgeIdxs = hovered!==null ? (neighborEdges[hovered]||[]) : [];
  var edgeEndpoints = hoveredEdge!==null ? [edges[hoveredEdge].a, edges[hoveredEdge].b] : [];
  nodes.forEach(function(n, idx){
    var isHovered = idx===hovered;
    var isConnected = hovered!==null && activeEdgeIdxs.some(function(ei){ return edges[ei].a===idx || edges[ei].b===idx; });
    var isHalfLit = hoveredEdge!==null && edgeEndpoints.indexOf(idx)!==-1;
    var targetMultiplier = isHovered ? NC.hoverScaleMultiplier : 1;
    var targetOpacityCore = hovered===null ? NC.restOpacity : (isHovered ? NC.hoverOpacity : (isConnected ? NC.connectedOpacity : NC.dimmedOpacity));
    var targetGlowOp = n.baseGlowOpacity * (isHovered ? NC.hoverGlowMultiplier : (isHalfLit ? NC.halfLitGlowMultiplier : (hovered===null ? 1 : (isConnected ? NC.connectedGlowMultiplier : 0.3))));
    var targetRingOp = n.baseRingOpacity * (isHovered ? NC.hoverRingMultiplier : (isHalfLit ? NC.halfLitRingMultiplier : (hovered===null ? 1 : (isConnected ? NC.connectedRingMultiplier : 0.25))));

    var s = n.core.scale.x + (targetMultiplier - n.core.scale.x)*NC.easeSpeed;
    n.core.scale.setScalar(s);
    n.core.material.opacity += (targetOpacityCore - n.core.material.opacity)*NC.easeSpeed;

    n.glow.material.opacity += (targetGlowOp - n.glow.material.opacity)*NC.easeSpeed;
    var gs = n.baseGlowScale * (isHovered?1.5:1);
    var curGS = n.glow.scale.x;
    var newGS = curGS + (gs-curGS)*NC.easeSpeed;
    n.glow.scale.set(newGS,newGS,1);

    n.ring.material.opacity += (targetRingOp - n.ring.material.opacity)*NC.easeSpeed;
    var rs = n.baseRingScale * (isHovered?1.7:1);
    var curRS = n.ring.scale.x;
    var newRS = curRS + (rs-curRS)*NC.easeSpeed;
    n.ring.scale.set(newRS,newRS,1);
  });

  edges.forEach(function(e, ei){
    var isActive = hovered!==null && (e.a===hovered || e.b===hovered);
    var isDim = hovered!==null && !isActive;
    var isLineHovered = ei===hoveredEdge;
    var targetOp = isLineHovered ? EC.hoverLineOpacity : (isActive ? EC.hoverConnectedOpacity : (isDim ? EC.dimmedOpacity : EC.restOpacity));
    e.mat.opacity += (targetOp - e.mat.opacity)*EC.easeSpeed;
  });

  if(hovered!==null && !warping){
    positionPanel(hovered);
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

})();
</script>
</body>
</html>
