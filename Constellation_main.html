<style>
  /* ===========================================================
     INTERFACE COLORS — edit these to re-theme the chrome
     (panel, text, article view). The 3D scene's own colors
     live in the CONFIG object at the top of the <script> below.
  =========================================================== */
  :root{
    --bg:#07070a;
    --bg-deep:#000000;
    --ink:#e9e6df;
    --ink-dim:#8f8c88;
    --ink-faint:#565450;
    --line:#232227;
    --panel-bg:rgba(10,10,12,0.86);
    --panel-border:#101012;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg-deep);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #scene-wrap{
    position:fixed; inset:0;
    transition:opacity 1.1s cubic-bezier(.65,0,.35,1);
  }
  canvas#bg{ display:block; width:100%; height:100%; }

  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:
      radial-gradient(ellipse at 50% 44%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 28%, rgba(0,0,0,0.5) 62%, rgba(0,0,0,0.88) 92%, rgba(0,0,0,0.97) 100%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 55%);
  }
  #grain{
    position:fixed; inset:0; pointer-events:none; z-index:3;
    opacity:0.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  #brand{
    position:fixed; top:38px; left:50px; z-index:5;
    font-family:'IBM Plex Mono', monospace;
    font-size:24px; letter-spacing:0.55em; text-transform:lowercase;
    color:var(--ink-dim);
    pointer-events:none;
  }
  #brand span{ color:var(--ink-faint); }

  #hint{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    z-index:5; font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:0.15em; text-transform:uppercase;
    color:var(--ink-faint);
    pointer-events:none;
    transition:opacity 0.6s ease;

  /* floating info panel */
  #panel{
    position:fixed; z-index:6; width:280px;
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    backdrop-filter:blur(6px);

  }
  #panel.visible{ opacity:1; transform:translateY(0); }
  #panel .cat{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:0.16em; text-transform:uppercase;
    margin-bottom:10px;
  }
  #panel h3{
    font-family:'Fraunces', serif; font-weight:400; font-style:italic;
    font-size:22px; line-height:1.25; margin:0 0 10px 0; color:var(--ink);
  }
  #panel p{
    font-size:12.5px; line-height:1.6; color:var(--ink-dim);
    margin:0 0 14px 0;
  }
  #panel .meta{
    font-family:'IBM Plex Mono', monospace; font-size:10px;
    letter-spacing:0.06em; color:var(--ink-faint);
    display:flex; justify-content:space-between;
    border-top:1px solid var(--line); padding-top:10px;
  }

  /* article view */
  #article-view{
    position:fixed; inset:0; z-index:10;
    overflow-y:auto;
    background:var(--bg-deep);
    opacity:0; visibility:hidden;
    transition:opacity 0.9s cubic-bezier(.65,0,.35,1);

  #article-view.visible{ opacity:1; visibility:visible; }
  #article-view::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.035) 0%, rgba(0,0,0,0) 55%);
  }
  .back-btn{

  .article-column{

  .article-meta{

    padding-bottom:34px; margin-bottom:34px;

  .article-body p{

(function(){

/* ===========================================================================
   CONFIG
   Everything you're likely to want to tune — colors, speeds, sizes, timings —
   lives here. The rendering code below just reads these values, so you
   should rarely need to touch anything past the ARTICLES list.
=========================================================================== */
var CONFIG = {

  /* One entry per category. `color` accepts any CSS hex string.
     Add a category here, then use its key as `cat` on an article below. */
  categories: {
    physics:  { label:'Physics & Cosmos',        color:'#9bd4c9' },
    robotics:     { label:'Robotics',              color:'#b0ace3' },
    mun:       { label:'Model United Nations ',  color:'#x  ff6966' },
    tech:      { label:'Technology',             color:'#acd89a' },
    comp: { label:'Competitions',       color:'#00a2e8' },
    essays: { label:'Essays',                       color:'#eb9850' },
    misc: { label:'Miscellaneous',                 color:'#79ba00' }
  },

  /* Camera + orbit controls */
  scene: {
    fov: 46,
    homeTheta: 0.35,          // starting horizontal angle (radians)
    homePhi: 2.25,            // starting vertical angle (radians)
    homeRadius: 20,           // starting distance from center — bigger = more zoomed out
    zoomMin: 6,
    zoomMax: 30,
    dragRotateSpeed: 0.0045,
    dragTiltSpeed: 0.0035,
    wheelZoomSpeed: 0.012,
    idleRotateSpeed: 0.052,   // how fast the constellation slowly turns on its own
    idleResumeDelay: 2600,    // ms of no interaction before auto-rotate resumes
    followEase: 0.08          // how quickly the camera eases toward target each frame (0-1)
  },

  /* Background starfield */
  starfield: {
    far:  { count:450, spread:90, size:0.10, opacity:0.40 },
    near: { count:120, spread:40, size:0.14, opacity:0.55 },
    driftSpeed: 0.0025
  },

  /* Occasional shooting star */
  shootingStar: {
    minDelay: 2000,          // ms between meteors, minimum
    maxDelay: 3000,          // ms between meteors, maximum
    speedMin: 9, speedMax: 15,
    lifetimeMin: 1.1, lifetimeMax: 1.7,
    trailLengthMin: 3.5, trailLengthMax: 6.5,
    lineOpacity: 0.8,
    glowOpacity: 0.55
  },

  /* Node (star) appearance + hover behaviour */
  nodes: {
    sphereRadius: 6.6,           // radius of the golden-angle placement sphere
    radiusJitterMin: 0.72,       // inner bound of per-node depth jitter
    radiusJitterRange: 0.42,     // spread of per-node depth jitter
    baseSizeMin: 0.12,           // core sphere radius at importance 0.5
    baseSizeScale: 0.1,          // extra radius per unit of importance above 0.5
    glowScaleMultiplier: 8,
    ringScaleMultiplier: 5.4,
    baseGlowOpacity: 0.3,
    baseRingOpacity: 0.22,
    hoverScaleMultiplier: 1.9,
    hoverGlowMultiplier: 2.6,
    hoverRingMultiplier: 3.2,
    halfLitGlowMultiplier: 1.7,   // boost when a node's connecting line (not the node) is hovered
    halfLitRingMultiplier: 1.9,
    connectedGlowMultiplier: 1.3, // boost for nodes connected to the hovered node
    connectedRingMultiplier: 1.4,
    restOpacity: 0.95,
    hoverOpacity: 1,
    connectedOpacity: 0.75,
    dimmedOpacity: 0.28,
    easeSpeed: 0.15
  },

  /* Connecting lines between nodes */
  edges: {
    nearestNeighbors: 2,          // each node auto-connects to its N closest neighbours
    extraCrossings: [[0,7],[2,10],[4,12],[1,9]], // extra long lines, by article index — for visual interest
    color: 0xffffff,
    restOpacity: 0.1,
    hoverConnectedOpacity: 0.85,
    hoverLineOpacity: 1,
    dimmedOpacity: 0.025,

/* ===========================================================================
   ARTICLES
   One object per node. Add, remove, or edit freely — the constellation
   rebuilds itself from this list. Fields:
     id         unique slug
     cat        must match a key in CONFIG.categories
     importance 0.5 = average size; higher = a bigger, more prominent star
     title      shown in the panel + article header
     desc       one-line teaser shown in the hover panel
     date       display string
     readTime   minutes, shown in panel + article header
     body       array of paragraphs (plain strings)

     
    physics:  { label:'Physics & Cosmos',        color:'#9bd4c9' },
    robotics:     { label:'Robotics',              color:'#b0ace3' },
    mun:       { label:'Model United Nations ',  color:'#x  ff6966' },
    tech:      { label:'Technology',             color:'#acd89a' },
    comp: { label:'Competitions',       color:'#00a2e8' },
    essays: { label:'Essays',                       color:'#eb9850' },
    misc: { label:'Miscellaneous',                 color:'#79ba00' }
=========================================================================== */
var ARTICLES = [
  
  { id:'commonwealth', cat:'essays', importance:1.65,
    title:'Perfectly Imperfect Humans',
    desc:'An essay on how humanity still exists due to our flaws. However perfect we make robots, our flaws can never be replaced',
    date:'30 Apr 2026', readTime:10,
    body:[
    `“Perfectly Imperfect Humans and Imperfectly Perfect Robots.” ~ Duncan Mclauchlan (Mclauchlan)`,
    `I believe that what people contribute to the Commonwealth that technology can never replace is not our cleverness, but our humanity. Not our data, but our glitches that make us real. By examining the unique value of human imperfection and the necessity of emotional irrationality, we find that human connection is not vital despite our flaws, but precisely because of them. To remain uniquely human in a digital age, we must stop trying to be better computers and instead reclaim our right to be beautifully, defiantly broken: perfectly imperfect; not just as individuals, but as communities across the Commonwealth bound by shared histories and experiences.`,
    `The digital world is a kingdom of straight lines, defined by perfection, where algorithms run flawlessly, and data never decays. Yet this perfection has its flaw: machines can't understand the realities of the real world or have primal instincts to act. Machines can only help us in our day-to-day lives. The way technology has improved the lifestyle of hundreds of humans is immeasurable, but at the same time, we are instinctively human, and this right to be imperfect, this instinct to strive for excellence, is something a machine can never relate to. True human value comes from imperfection, emotions and lived experiences.`,
    `Today, people argue about why we should fear machines and how they are the end of humanity. But at the end of the day, isn’t it the point of machines to outperform humans? Isn’t the very reason for the existence of technology to do things humans could never do? A gun throws objects much faster and farther than humans. A crane lifts deadly loads, and a smartphone performs complex calculations and communicates over long distances. Yet, all are tools, useless without human operators. No matter how powerful, how intelligent artificial intelligence (AI) becomes, it will not have the primal drives that biological creatures have, or a range of emotions that work with those drives to motivate a human to do something.`,
    `As George Orwell once said, “The essence of being human is that one does not seek perfection” (Orwell).`,
    `A machine is like a metronome, perfectly precise, hitting every beat down to the exact millisecond. But no one goes to a concert to listen to a metronome. One goes to hear the drummer who plays music, the one who plays a fraction of a second behind or ahead of the beat, finding the beauty in the perfect imperfection of music, one who can show us the secrets hidden in every beat, every stroke, every swing.`,
    `Leonard Cohen captured this beautifully: “There is a crack in everything, that’s how the light gets in” (Cohen).`,
    `This highlights Moravec’s Paradox: while it is easy for a computer to exhibit adult-level performance on a logic test, it is nearly impossible for it to navigate the physical and social world with the grace of a one-year-old (Moravec). Machines struggle with the “messy” due to their inability to understand the non-linear. Take, for example, the act of knitting; from a purely economic standpoint, a machine knitter is superior; it is faster, cheaper, and produces a flawless stitch. However, knitting in a group creates a social fabric that a factory can't replicate. The "faults" in a hand-knit sweater show human presence and shared stories during needlework. In many Commonwealth communities, acts like knitting, storytelling, or communal cooking are the backbone of social cohesion, something technology can't replicate.`,
    `A machine can remember all you said, calculate outcomes, and respond instantly. It won't forget, contradict itself, or err. Yet it will never understand you. This isn't a technical limitation but a fundamental truth about technology and humanity. In a diverse Commonwealth, united not by algorithms but by shared history, grief, and human grace, this truth is urgent.`,
    `Across the Commonwealth, from the schoolrooms of Nairobi to the fishing villages of the Pacific Islands, what sustains communities is not efficiency. It is the quality of human presence - the teacher who notices the child who is struggling not because of a diagnostic algorithm but because she recognises in that child something of herself; the neighbour who knocks on a door not because a wellness app flagged a concern but because something felt wrong.`,
    `Consider kintsugi, the art of repairing broken pottery with gold, not concealing the damage, but illuminating it, transforming fracture into narrative (Deng). These objects are the most honest accounts of what it means to be alive. No technology can ever truly capture the essence of an object, the stories behind it and the time which went into it. Like the gold in the cracks of kintsugi, our shared history and our 'perfect imperfections' are what turn the fragments of our diverse nations into a single, beautiful narrative. We do not need to be better computers; we simply need to be the light getting in through the cracks. A machine will tell us the absolute truth, but sometimes it's not just the straightforward answer we want. It's the friends and memories we made along the way.`,
    `This essay was submitted to the 2026 Commonwealth Essay Competition. Results are not yet announced.`
  ]},

  { id:'cambridge', cat:'essays', importance:1.4,
    title:'From Zero to One',
    desc:'Why governments must fund moonshot science, and why incrementalism is a moral abdication of the future.',
    date:'22 May 2026', readTime:12,
    body:[`In 1962, standing before a crowd at Rice University, President John F. Kennedy declared that the United States would go to the Moon not because it was easy, but precisely because it was hard. Many dismissed the statement as political theatre. It was, in fact, something more precise: an institutional commitment to the idea that civilisational ambition is itself a policy instrument. Kennedy was not announcing a programme with a calculated return on investment. He was placing a civilisational bet, and in doing so, changing what the future was allowed to contain. Today, as governments wrestle with finite budgets and infinite demands, a familiar logic re-emerges: fund what works, what is proven, what delivers measurable benefit within an election cycle. This essay argues that this logic, however prudent it sounds, is historically illiterate and strategically self-defeating. The thesis is this: governments are the only institutions structurally capable of funding science at the scale and patience that civilisation-altering problems require, and to retreat to pure incrementalism is not caution. It is the slow, deniable abdication of the future.`,
    `The case for moonshot public funding begins not with ideology but with structure. Private capital, even at its most ambitious, is constrained by a time horizon that satisfies shareholders and quarterly earnings calls. Mariana Mazzucato's The Entrepreneurial State (2013) makes this structural point with precision: the technologies that define the modern world, the internet, GPS, touchscreens, and the algorithms underlying search engines were not born in Silicon Valley. They were born in DARPA laboratories and government-funded research institutions, then handed to the private sector to commercialise. As Mazzucato observes, "the private sector only finds the courage to invest after an entrepreneurial state has made the high-risk investments." Moonshots, in other words, are not anti-market. They are market-making.`,
    `The iPhone, that canonical symbol of private innovation, is in reality a public artefact. Every core technology within it, the internet protocol, GPS navigation, the touchscreen interface, Siri's voice recognition, emerged from publicly funded research conducted decades before Apple's founding. Steve Jobs did not build on a foundation laid by the market. He built on a foundation laid by the state. The same pattern appears in space research: NASA's own economic-impact report for 2023 records that the agency generated $76 billion in economic output while consuming less than 0.5% of the US federal budget, and has catalogued more than 2,000 commercial spinoffs since 1976. The arithmetic of ambition, it turns out, is surprisingly generous.`,
    `This is not a coincidence. It reflects a basic asymmetry: the timeline for moonshot science — curing ageing, achieving nuclear fusion, developing interstellar propulsion is measured in decades, not quarters. No hedge fund will finance a project whose first meaningful result arrives in thirty years. No pharmaceutical company will invest in defeating biological senescence if the patent clock expires before clinical deployment. Only governments, insulated (when functioning well) from short-term profit imperatives, can make these bets. Vannevar Bush understood this in 1945, writing in Science, the Endless Frontier, that basic research is "the pacemaker of technological progress" and the "scientific capital" from which all practical applications must eventually be drawn. To stop funding moonshots is to stop replenishing the well.`,
    `The case for prioritising incremental research is superficially compelling: it is reliable, accountable, and evidence-based. But consider a thought experiment. In 1900, a forward-thinking government seeking to "incrementally improve" transport would have invested in better horse-breeding programmes, wider cobblestone roads, and more efficient saddle design. All are measurably beneficial and immediately applicable. None of which led to the automobile. The automobile did not emerge from incremental improvements in horses. It required a conceptual rupture — a willingness to fund something that seemed absurd to a world organised around horses.`,
    `Peter Thiel names this distinction in Zero to One (2014): the difference between going from "1 to n" (making more of what already exists) and going from "0 to 1" (creating something genuinely new). Incremental funding, by definition, funds the former. The mathematical analogy embedded within Thiel’s idea is revealing. There are infinitely more real numbers between 0 and 1 than there are natural numbers between 1 and infinity. Moving from “0 to 1” — from impossibility to possibility changes the structure of reality itself. Once flight became possible, the world reorganised around aviation. Once computation became possible, civilisation reorganised around information. The space of genuine novelty is denser, richer, and more generative than the space of incremental improvement. Governments that only optimise within the known paradigm are not being prudent, they are systematically ignoring the more fertile territory.`,
    `To understand why moonshots are necessary, consider the Hill-Climber’s Paradox: a traveller climbing a hill in fog, each step feeling like progress, reaching a peak. But if fog lifts, they may see it's just a foothill, with a mountain range beyond a valley. Incrementalism is climbing the current hill, while a moonshot chooses to descend into uncertainty to reach a larger mountain.`,
    `The historical record of large-scale public science investment is not a story of uniform triumph, but it is a story of extraordinary asymmetric returns. The Manhattan Project, the Moon landing, the development of AIDS therapies in the 1980s, and the completion of the Human Genome Project in the 1990s all represent cases where focused public ambition produced outcomes that no incremental programme would have reached (Fauci and Lane). Nixon's war on cancer in the 1970s is the counter-example critics rightly invoke — a moonshot that failed to deliver its headline promise (National Cancer Institute). But even that failure produced oncological insights, imaging technologies, and chemotherapy protocols that went on to save millions of lives. The "waste" in moonshot funding is rarely lost. It is transformed.`,
    `The Human Genome Project is the purest case study. Launched in 1990, it was initially derided as absurdly expensive and speculative. Critics argued the money would be better spent on immediate healthcare improvements - building clinics, training doctors, buying drugs that already worked. The project cost roughly $3 billion over thirteen years. A 2013 analysis by the Battelle Memorial Institute estimated it had by then generated $796 billion in economic activity and 310,000 jobs, with cascading effects in cancer diagnostics, personalised medicine, and forensic science still compounding today. The return-to-investment ratio was approximately 178:1. No incremental programme in the history of public health funding has approached that figure. And crucially, the cascade of benefit went far beyond genetics — because when you aim for a moonshot, the technical hurdles you encounter force you to solve problems you did not even know existed.`,
    `"The most important thing we can do is to expand the scope of what we think is possible." — Richard Feynman, The Pleasure of Finding Things Out (1999)`,
    `The private market can't fund interstellar travel since 'payback periods' exceed a human lifetime. Governments fill this gap because markets underprovide long-term public goods. A health system focused only on current symptoms perpetuates the problem. As the 'ultimate risk-bearer,' government creates a 'common' knowledge base for the private sector to build upon.`,
    `The strongest objection to moonshot funding is not that it is too expensive. It is the objection raised by Daniel Sarewitz in Frontiers of Illusion (1996): ambitious science doesn't always bring social benefits and often makes false promises. Funds for megaprojects can displace community-focused research that meets urgent human needs. This critique should be considered seriously, not dismissed.`,
    `But Sarewitz's objection, correctly understood, is an argument for better governance of moonshots, not for their abandonment. The answer to the risk of misdirected ambition is not to eliminate ambition but to democratise its selection. Sheila Jasanoff's work in The Ethics of Invention (2016) points toward what she calls "sociotechnical imaginaries" — the idea that different societies legitimately envision different scientific futures, and that the choice of which futures to pursue must involve broader democratic deliberation rather than expert consensus alone. The solution to ambitious science that might outpace our ethical readiness — the concern Nicholas Agar raises in Humanity's End (2010) regarding radical enhancement — is not to defund the dream but to bring the humanities into the laboratory. Ethics and ambition are not opposites. They are co-producers of responsible innovation.`,
    `What this means in practice is that the governance of moonshot funding matters as much as the funding itself. The EU's Graphene Flagship initiative was not a blank cheque handed to physicists. It involved systematic review panels, industry partnerships, and defined social impact objectives. The US government's ARPA-E funds high-risk energy research with explicit milestones and portfolio logic. The UK's Advanced Research and Invention Agency is explicitly modelled on DARPA's mandate to fund research "too risky for conventional funders." These are not reckless experiments. They are structured risk-taking — with the state acting as the only investor with a long enough time horizon and a broad enough mandate to absorb the inevitable failures that precede transformative success.`,
    `Critics of moonshots frequently point to failed large-scale projects as evidence against ambitious funding. President Richard Nixon’s “War on Cancer” in the 1970s, for example, failed to produce the decisive cure that politicians promised. However, this criticism misunderstands how transformative science actually works. Moonshots rarely succeed in the exact way originally imagined. Their value often emerges indirectly through what may be called “collateral innovation.”`,
    `Science scholar Daniel Sarewitz, in Frontiers of Illusion (1996), argues ambitious science doesn't guarantee social benefit. While criticising scientific ambition, he underestimates how moonshots create unforeseen tech ecosystems. The Apollo Program didn’t build lunar cities or colonies in the twentieth century, so by narrow standards, it might seem a failure. However, Apollo technologies transformed telecommunications, materials science, integrated circuits, weather forecasting, satellite systems, and computing. NASA reports thousands of tech spinoffs from space research.`,
    `There is a final dimension that the standard framing consistently obscures: the ethics of not trying. The debate is typically staged as a contest between ambitious risk and cautious responsibility — as though incremental funding is the morally safe option and moonshots are the morally extravagant one. This framing is false. Both paths carry moral weight. The risk of moonshot failure is visible, countable, and attributable. The risk of incremental timidity is invisible, distributed, and deniable. That asymmetry of visibility is routinely mistaken for an asymmetry of moral significance.`,
    `Every year that ageing remains biologically unchallenged costs approximately 100,000 human lives per day worldwide — not from war or poverty but from the cellular process of senescence (World Health Organization). Every decade that nuclear fusion remains "thirty years away" because governments preferred the safer investment represents a choice about which populations absorb the cost of the delay. A health system that only funds today's symptoms without building tomorrow's cure will always be chasing the problem. A government that only repairs the current infrastructure without investing in next-generation solutions will always be one crisis behind. The best objection to moonshot funding — that money is finite and immediate needs are real — is precisely correct. And that is exactly why moonshots must be publicly funded, because governments are the only institutions whose mandate extends beyond the immediate, whose obligations reach toward the future rather than only the present.`,
    `J. D. Bernal argued in The Social Function of Science (1939) that scientific ambition must be consciously aligned with social need. The insight cuts both ways. To align with genuine social need is to reckon honestly with the scale and irreversibility of the problems that await us: climate tipping points, pandemic preparedness, neurodegenerative disease, the energy transition. These are not problems that incremental improvement, compounded over decades, will be fast enough to solve. They are problems that demand the willingness to descend into the valley.`,
    `The case for government funding of moonshot science is not a case for recklessness or for the abandonment of accountability. It is a case for institutional realism. Markets cannot fund it — their time horizons are too short. Philanthropy cannot sustain it at scale — its capital base is too narrow. International bodies cannot coordinate it reliably — their mandates are too contested. Only the state, functioning as what Mazzucato calls an "entrepreneurial state" rather than a merely regulatory one, has the combination of capital, patience, and civilisational mandate that transformative science requires.`,
    `The Manhattan Project. The Moon landing. AIDS therapies. The Human Genome Project. Each was speculative, each was expensive, and each was irreplaceable. Nixon's war on cancer reminds us that moonshots can fail on their headline promise — but even failed moonshots tend to cascade into advances that incremental research would have taken far longer to reach. The record of ambitious public science is not a record of uniform triumph. It is a record of asymmetric returns that no cautious portfolio could have generated.`,
    `A society without ambitious public science does not remain stable — it slowly becomes trapped inside the size of its current imagination. Governments that fund only what they can already measure will eventually find that they can only imagine what they already know. The question before policymakers is not whether some budget should go to speculative projects. It is whether we have the institutional courage to make the bet — to descend into the valley of uncertainty, knowing the mountain is there, even when the fog is thick and the election is close.`,
    `"Basic research is the pacemaker of technological progress... it creates the fund from which the practical applications of knowledge must be drawn." — Vannevar Bush, Science, the Endless Frontier (1945)`,
    `Bush wrote those words in the aftermath of a war that had proven, with terrible clarity, what happens when nations invest in transformative science — and what happens when they do not. The lesson has not aged. Governments that fund moonshots are not gambling with public resources. They are honouring the only obligation that matters across generations: expanding what the future is allowed to be.`,
    `Moonshots are not a luxury after the "real" work is done; they are part of the real work. The right model for a healthy society is not "either/or," but "base hits plus one or two attempts at a civilization-changing swing".`,
    `This essay was submitted to the 2026 CCIR Cambridge Re:Think Essay Competition and won the Honourable Mention award`
]},
    { id:'cyclotron', cat:'robotics', importance:1.6,
    title:'A Cyclotron (Particle Accelerator) Demonstration',
    desc:'My journey making a cyclotron from scratch, using electromagnets to accelerate a neodymium magnet in a circular path, and the physics behind it.',
    date:'10 Oct 2026', readTime:14,
    body:[
      `A while ago, I came across the idea of building a simple tabletop particle accelerator and immediately found the concept fascinating; especially after my recent trip to CERN, which allowed me to take a deeper look into the engineering behind massive supercolliders. Real particle accelerators are enormous machines involving superconducting magnets, radio-frequency cavities, ultra-high vacuum systems and incredibly precise control electronics. Building anything remotely similar at home sounded unrealistic. Instead, I decided to build a demonstration model that could reproduce one of the most fundamental ideas behind an accelerator: giving a moving object repeated, precisely timed electromagnetic pushes.`,
      `The result was my Electromagnetic Particle Accelerator Demonstration, a small circular accelerator in which an 8 mm magnetic sphere travels around a 160 mm-diameter track while electromagnets repeatedly accelerate it.`,
      `The project was inspired by the principles behind machines such as cyclotrons and synchrotrons, although the mechanism is different from a real particle accelerator. In an actual accelerator, charged particles are accelerated primarily by electric fields while magnetic fields guide and focus them. My model instead uses magnetic attraction to accelerate an 8mm neodymium sphere.`,
      `The central idea is surprisingly simple. Imagine pushing a ball around a circular track. If I could give the ball a small forward push every time it reached a particular point, the pushes would gradually increase its speed.`,
      `That is essentially what my accelerator does.`,
      `The track has a major radius of 80 mm, meaning the centre of the magnetic sphere travels around a circular path with approximately an 80 mm radius. The track also has a minor radius of 7.5 mm, which forms the groove in which the sphere travels.`,
      `Two electromagnets are positioned opposite one another around the track. As the magnetic sphere approaches a coil, the coil is switched on for a short period. The magnetic field attracts the sphere and transfers energy to it. The coil then switches off before the sphere can be pulled backwards. The process repeats at the opposite coil and on every subsequent revolution.`,
      `I designed the accelerator structure using Blender and 3D printed the components in PLA. Designing the track was one of the first major challenges because the ball needed to move freely while remaining sufficiently constrained.`,
      `The dimensions had to balance several factors. If the groove was too tight, friction would slow the sphere significantly. If it was too loose, the sphere could move unpredictably and lose contact with the intended path. The final design used the 80 mm major radius and 7.5 mm minor radius.`,
      `The accelerator was designed as a two-part circular assembly that could be closed around the magnetic sphere. The coils were positioned on opposite sides of the track.`,
      `Each electromagnet consists of approximately 100 turns of 0.51 mm diameter enameled copper wire. The coils are connected in series and are driven by the transistor circuit.`,
      `The coils ultimately became one of the most important parts of the entire system because increasing the magnetic field is not simply a matter of increasing the voltage. Higher current produces a stronger magnetic field, but also increases heating and places greater demands on the transistor and battery.`,
      `The circuit uses electromagnetic induction to detect the moving sphere itself.`,
      `The circuit is based around three transistors: a BC558 PNP transistor, BC337 NPN transistor and BD135 power transistor. It also includes a 1000 μF capacitor, a 1 MΩ potentiometer, two 100 kΩ resistors, a 1 kΩ resistor, a 12 kΩ resistor and a 100 Ω resistor, with a 9 V battery providing the power.`,
      `When the magnetic sphere moves near a coil, the changing magnetic flux induces a voltage in the coil according to Faraday's law.`,
      `This tiny induced voltage is used by the transistor circuit as a trigger. The BC558 responds to the induced signal, which then drives the BC337. The BC337 controls the base of the BD135, which acts as the power transistor responsible for switching the coil current.`,
      `In effect, the same electromagnetic system acts as both a sensor and an actuator.`,
      `The project also gave me a much better appreciation for real particle accelerators. My small 160 mm track is obviously nothing compared with facilities such as the LHC, but the underlying engineering philosophy is surprisingly relatable.`
    ]},

    { id:'cov', cat:'mun', importance:0.6,
    title:'The Congress of Vienna at LMCMUN\'26',
    desc:'My journey as a rapparteur in the Congress of Vienna committee at LMCMUN\'26',
    date:'19 May 2026', readTime:6,
    body:[
      `My enemies are many. My equals are none. ~ Naploeon Bonaparte`,
      `The Congress of Vienna at LMCMUN 2026 was, for me, much more than another MUN committee. Sitting on the Executive Board as a Rapporteur gave me an entirely different perspective on what happens inside a committee. I was no longer concerned with defending a portfolio, preparing arguments, or trying to win a debate. Instead, I had the opportunity to watch thirty individuals attempt to reshape post-Napoleonic Europe from across the room.`,
      `The committee was set in 1814, at a moment when Europe was technically approaching peace but was nowhere close to stability. As our Study Guide put it, Europe was in a “hallway of pause.” Napoleon had been defeated, but the coalition that had defeated him was already beginning to fracture.`,
      `As a Rapporteur, seeing delegates discover these differences in real time was one of the most rewarding parts of the experience. I particularly enjoyed watching the committee move beyond speeches and into genuine diplomacy. The most important developments were often not the ones happening at the centre of the room. They were happening in conversations between delegates: alliances being quietly formed, positions being negotiated, information being exchanged and concessions being offered. A delegate could deliver an excellent speech and still have little influence if they could not convert that speech into relationships.`,
      `The reverse was equally interesting. Some delegates were not necessarily the loudest voices in the room, yet gradually became essential to negotiations because they possessed something another delegate needed.`,
      `Watching delegates navigate this was genuinely fascinating because there was rarely a straightforward "correct" answer. Every concession created another problem somewhere else.`,
      `That was also what made my role as Rapporteur so interesting. I could observe the entire political ecosystem rather than being confined to one portfolio. I could see alliances forming before they became obvious, watch delegates change their strategies, and see how individual actions affected the broader balance of the committee.`,
      `Most importantly, I got to watch delegates become their portfolios. A successful delegate was not simply someone who knew the history of Napoleon or could quote Metternich. They were someone who understood what their character wanted, what they could realistically achieve, whom they could influence and what they were willing to sacrifice to get there.`
    ]},

/* ===========================================================================
   IMPLEMENTATION — shouldn't need to touch anything below this line
=========================================================================== */
function cat(id){ return CONFIG.categories[id]; }

/* --- renderer / scene / camera --- */
var canvas = document.getElementById('bg');
var renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x07070a, 1);

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(CONFIG.scene.fov, window.innerWidth/window.innerHeight, 0.1, 200);

/* --- orbit rig (spherical camera controls, custom + light) --- */
var rig = { theta: CONFIG.scene.homeTheta, phi: CONFIG.scene.homePhi, radius: CONFIG.scene.homeRadius };
var HOME = { theta: CONFIG.scene.homeTheta, phi: CONFIG.scene.homePhi, radius: CONFIG.scene.homeRadius };
var targetRig = { theta: rig.theta, phi: rig.phi, radius: rig.radius };

function updateCameraFromRig(){
  var t = rig.theta, p = Math.max(0.35, Math.min(Math.PI-0.35, rig.phi)), r = rig.radius;
  camera.position.set(
    r * Math.sin(p) * Math.sin(t),
    r * Math.cos(p),
    r * Math.sin(p) * Math.cos(t)
  );
  camera.lookAt(0,0,0);
}
updateCameraFromRig();

/* --- starfield --- */
function makeStarfield(count, spread, size, opacity){
  var geo = new THREE.BufferGeometry();
  var pos = new Float32Array(count*3);
  for(var i=0;i<count;i++){
    var r = spread * (0.35 + Math.random()*0.65);
    var th = Math.random()*Math.PI*2;
    var ph = Math.acos((Math.random()*2)-1);
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.sin(ph)*Math.sin(th);
    pos[i*3+2] = r*Math.cos(ph);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  var mat = new THREE.PointsMaterial({ color:0xffffff, size:size, sizeAttenuation:true, transparent:true, opacity:opacity, depthWrite:false });
  return new THREE.Points(geo, mat);
}
var starsFar = makeStarfield(CONFIG.starfield.far.count, CONFIG.starfield.far.spread, CONFIG.starfield.far.size, CONFIG.starfield.far.opacity);
var starsNear = makeStarfield(CONFIG.starfield.near.count, CONFIG.starfield.near.spread, CONFIG.starfield.near.size, CONFIG.starfield.near.opacity);
scene.add(starsFar); scene.add(starsNear);

/* --- glow + ring-halo textures --- */
function makeGlowTexture(){
  var size=128, c=document.createElement('canvas'); c.width=c.height=size;
  var ctx=c.getContext('2d');
  var g=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.35,'rgba(255,255,255,0.5)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
function makeRingTexture(){
  var size=256, c=document.createElement('canvas'); c.width=c.height=size;
  var ctx=c.getContext('2d');
  ctx.translate(size/2,size/2);
  ctx.strokeStyle='rgba(255,255,255,1)';
  ctx.lineWidth=5;
  ctx.shadowColor='rgba(255,255,255,0.9)';
  ctx.shadowBlur=10;
  ctx.beginPath();
  ctx.arc(0,0,size*0.34,0,Math.PI*2);
  ctx.stroke();
  return new THREE.CanvasTexture(c);
}
var glowTex = makeGlowTexture();
var ringTex = makeRingTexture();

/* --- occasional shooting star --- */
function makeShootingStar(){
  var SS = CONFIG.shootingStar;
  var segs = 10;
  var trailLength = SS.trailLengthMin + Math.random()*(SS.trailLengthMax-SS.trailLengthMin);
  var startRadius = 16 + Math.random()*10;
  var theta = Math.random()*Math.PI*2;
  var phi = Math.PI*0.22 + Math.random()*Math.PI*0.56;
  var start = new THREE.Vector3(
    startRadius*Math.sin(phi)*Math.cos(theta),
    startRadius*Math.cos(phi),
    startRadius*Math.sin(phi)*Math.sin(theta)
  );
  var dir = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();

  var positions = new Float32Array((segs+1)*3);
  var colors = new Float32Array((segs+1)*3);
  var head = new THREE.Color(0xffffff);
  var tail = new THREE.Color(0x000000);
  for(var s=0;s<=segs;s++){
    var f = s/segs;
    positions[s*3]   = -dir.x*f*trailLength;
    positions[s*3+1] = -dir.y*f*trailLength;
    positions[s*3+2] = -dir.z*f*trailLength;
    var col = head.clone().lerp(tail, f);
    colors[s*3]=col.r; colors[s*3+1]=col.g; colors[s*3+2]=col.b;
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  var mat = new THREE.LineBasicMaterial({ vertexColors:true, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
  var line = new THREE.Line(geo, mat);

  var headGlowMat = new THREE.SpriteMaterial({ map:glowTex, color:0xffffff, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
  var headGlow = new THREE.Sprite(headGlowMat);
  headGlow.scale.set(0.5,0.5,1);

  var group = new THREE.Group();
  group.position.copy(start);
  group.add(line);
  group.add(headGlow);

  return {
    group:group, mat:mat, glowMat:headGlowMat, dir:dir,
    speed: SS.speedMin + Math.random()*(SS.speedMax-SS.speedMin),
    age:0,
    lifetime: SS.lifetimeMin + Math.random()*(SS.lifetimeMax-SS.lifetimeMin)
  };
}
var shootingStars = [];
function spawnShootingStar(){
  var s = makeShootingStar();
  scene.add(s.group);
  shootingStars.push(s);
}
function scheduleNextShootingStar(){
  var SS = CONFIG.shootingStar;
  var delay = SS.minDelay + Math.random()*(SS.maxDelay-SS.minDelay);
  setTimeout(function(){ spawnShootingStar(); scheduleNextShootingStar(); }, delay);
}
scheduleNextShootingStar();

/* --- golden-angle (fibonacci sphere) node placement ---
   Depth jitter uses a golden-ratio low-discrepancy sequence (rather than
   plain Math.random) so nodes spread out evenly at every radius instead
   of clumping — same principle as the golden-angle placement itself. */
var N = ARTICLES.length;
var GOLDEN_ANGLE = Math.PI*(3-Math.sqrt(5));
var GOLDEN_RATIO_CONJUGATE = 0.6180339887498949;
function frac(x){ return x - Math.floor(x); }

var nodeGroup = new THREE.Group();
var lineGroup = new THREE.Group();
scene.add(lineGroup); scene.add(nodeGroup);

var nodes = []; // {data, core, glow, ring, position, ...}
var NC = CONFIG.nodes;

for(var i=0;i<N;i++){
  var yFrac = 1 - (i/(N-1))*2;
  var rAtY = Math.sqrt(Math.max(0,1-yFrac*yFrac));
  var theta = GOLDEN_ANGLE*i;
  var jitter = NC.radiusJitterMin + NC.radiusJitterRange * frac(i*GOLDEN_RATIO_CONJUGATE + 0.5);
  var baseR = NC.sphereRadius * jitter;
  var pos = new THREE.Vector3(
    Math.cos(theta)*rAtY*baseR,
    yFrac*baseR,
    Math.sin(theta)*rAtY*baseR
  );

  var data = ARTICLES[i];
  var c = cat(data.cat);
  var scale = NC.baseSizeMin + NC.baseSizeScale*(data.importance-0.5);

  var coreGeo = new THREE.SphereGeometry(scale, 20, 20);
  var coreMat = new THREE.MeshBasicMaterial({ color:c.color, transparent:true, opacity:NC.restOpacity });
  var core = new THREE.Mesh(coreGeo, coreMat);
  core.position.copy(pos);

  var glowMat = new THREE.SpriteMaterial({ map:glowTex, color:c.color, transparent:true, opacity:NC.baseGlowOpacity, blending:THREE.AdditiveBlending, depthWrite:false });
  var glow = new THREE.Sprite(glowMat);
  var glowScale = scale*NC.glowScaleMultiplier;
  glow.scale.set(glowScale, glowScale, 1);
  glow.position.copy(pos);

  var ringMatN = new THREE.SpriteMaterial({ map:ringTex, color:c.color, transparent:true, opacity:NC.baseRingOpacity, blending:THREE.AdditiveBlending, depthWrite:false });
  var ringSprite = new THREE.Sprite(ringMatN);
  var ringScale = scale*NC.ringScaleMultiplier;
  ringSprite.scale.set(ringScale, ringScale, 1);
  ringSprite.position.copy(pos);

  nodeGroup.add(glow);
  nodeGroup.add(ringSprite);
  nodeGroup.add(core);

  nodes.push({
    data:data, core:core, glow:glow, ring:ringSprite, position:pos,
    baseScale:scale, baseGlowOpacity:NC.baseGlowOpacity, baseGlowScale:glowScale,
    baseRingOpacity:NC.baseRingOpacity, baseRingScale:ringScale
  });
}

/* --- edges: connect each node to its nearest neighbours + a few long crossings --- */
var EC = CONFIG.edges;
var edgeSet = {};
function edgeKey(a,b){ return a<b ? a+'-'+b : b+'-'+a; }
var edges = [];

function addEdge(ai,bi){
  var k = edgeKey(ai,bi);
  if(edgeSet[k]) return;
  edgeSet[k]=true;
  var mat = new THREE.LineBasicMaterial({ color:EC.color, transparent:true, opacity:EC.restOpacity });
  var geo = new THREE.BufferGeometry().setFromPoints([nodes[ai].position, nodes[bi].position]);
  var line = new THREE.Line(geo, mat);
  lineGroup.add(line);
  edges.push({ a:ai, b:bi, line:line, mat:mat });
}

for(var i2=0;i2<N;i2++){
  var dists = [];
  for(var j2=0;j2<N;j2++){
    if(i2===j2) continue;
    dists.push({ j:j2, d:nodes[i2].position.distanceTo(nodes[j2].position) });
  }
  dists.sort(function(a,b){ return a.d-b.d; });
  for(var k2=0; k2<EC.nearestNeighbors && k2<dists.length; k2++){
    addEdge(i2, dists[k2].j);
  }
}
EC.extraCrossings.forEach(function(pair){
  if(pair[0]<N && pair[1]<N) addEdge(pair[0], pair[1]);
});

/* neighbour map for hover highlighting */
var neighborEdges = {};
edges.forEach(function(e, idx){
  neighborEdges[e.a] = neighborEdges[e.a] || [];
  neighborEdges[e.a].push(idx);
  neighborEdges[e.b] = neighborEdges[e.b] || [];
  neighborEdges[e.b].push(idx);
});
var hoveredEdge = null;

/* ---------------------------------------------------------
   INTERACTION: drag to orbit, wheel to zoom, hover raycast
--------------------------------------------------------- */
var SC = CONFIG.scene;
var isDragging = false, lastX=0, lastY=0, dragMoved=false;
var idleRotate = true;
var idleTimer = null;

function onDown(x,y){
  isDragging = true; dragMoved=false; lastX=x; lastY=y; idleRotate=false;
}
function onMove(x,y){
  if(!isDragging) return;
  var dx = x-lastX, dy = y-lastY;
  if(Math.abs(dx)>2 || Math.abs(dy)>2) dragMoved=true;
  targetRig.theta -= dx*SC.dragRotateSpeed;
  targetRig.phi   -= dy*SC.dragTiltSpeed;
  targetRig.phi = Math.max(0.5, Math.min(Math.PI-0.5, targetRig.phi));
  lastX=x; lastY=y;
}
function onUp(){
  isDragging=false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function(){ idleRotate = true; }, SC.idleResumeDelay);
}

canvas.addEventListener('mousedown', function(e){ onDown(e.clientX, e.clientY); });
window.addEventListener('mousemove', function(e){ onMove(e.clientX, e.clientY); updateMouseForRaycast(e.clientX, e.clientY); });
window.addEventListener('mouseup', onUp);

canvas.addEventListener('touchstart', function(e){ var t=e.touches[0]; onDown(t.clientX, t.clientY); }, {passive:true});
canvas.addEventListener('touchmove', function(e){ var t=e.touches[0]; onMove(t.clientX, t.clientY); updateMouseForRaycast(t.clientX, t.clientY); }, {passive:true});
canvas.addEventListener('touchend', onUp);

canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  targetRig.radius += e.deltaY*SC.wheelZoomSpeed;
  targetRig.radius = Math.max(SC.zoomMin, Math.min(SC.zoomMax, targetRig.radius));
  clearTimeout(idleTimer); idleRotate=false;
  idleTimer = setTimeout(function(){ idleRotate = true; }, SC.idleResumeDelay);
}, { passive:false });

var raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.2;
raycaster.params.Line.threshold = 0.12;
var mouseNDC = new THREE.Vector2(999,999);
function updateMouseForRaycast(cx, cy){
  mouseNDC.x = (cx/window.innerWidth)*2-1;
  mouseNDC.y = -(cy/window.innerHeight)*2+1;
}

var hovered = null;
var panel = document.getElementById('panel');
var panelCat = document.getElementById('panel-cat');
var panelTitle = document.getElementById('panel-title');
var panelDesc = document.getElementById('panel-desc');
var panelDate = document.getElementById('panel-date');
var panelTime = document.getElementById('panel-time');

function setHover(idx){
  if(hovered===idx) return;
  hovered = idx;
  if(idx===null){
    panel.classList.remove('visible');
    document.body.style.cursor='default';
    return;
  }
  var n = nodes[idx];
  var c = cat(n.data.cat);
  panelCat.textContent = c.label;
  panelCat.style.color = c.color;
  panelTitle.textContent = n.data.title;
  panelDesc.textContent = n.data.desc;
  panelDate.textContent = n.data.date;
  panelTime.textContent = n.data.readTime + ' min read';
  panel.classList.add('visible');
  document.body.style.cursor='pointer';
}

function positionPanel(idx){
  if(idx===null) return;
  var n = nodes[idx];
  var v = n.position.clone().project(camera);
  var x = (v.x*0.5+0.5)*window.innerWidth;
  var y = (-v.y*0.5+0.5)*window.innerHeight;
  var px = x+26, py = y-40;
  var pw = panel.offsetWidth || 280, ph = panel.offsetHeight || 160;
  if(px+pw > window.innerWidth-16) px = x-pw-26;
  if(py+ph > window.innerHeight-16) py = window.innerHeight-ph-16;
  if(py < 16) py = 16;
  panel.style.left = px+'px';
  panel.style.top = py+'px';
}

canvas.addEventListener('click', function(){
  if(dragMoved) return; // was a drag, not a click
  if(hovered!==null && !warping){
    goToArticle(hovered);
  }
});

/* ---------------------------------------------------------
   WARP TRANSITION + ARTICLE VIEW
--------------------------------------------------------- */
var warping = false;
var articleView = document.getElementById('article-view');
var articleColumn = document.getElementById('article-column');
var sceneWrap = document.getElementById('scene-wrap');
var hint = document.getElementById('hint');
var backBtn = document.getElementById('back-btn');

function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

function goToArticle(idx){
  warping = true;
  setHover(null);
  hint.style.opacity = '0';
  var n = nodes[idx];
  var startPos = camera.position.clone();
  var startTarget = new THREE.Vector3(0,0,0);
  var endPos = n.position.clone().multiplyScalar(CONFIG.warp.endDistanceMultiplier);
  var duration = CONFIG.warp.duration, start = null;

  function step(ts){
    if(!start) start = ts;
    var t = Math.min(1, (ts-start)/duration);
    var e = easeInOutCubic(t);
    camera.position.lerpVectors(startPos, endPos, e);
    camera.lookAt(n.position.clone().lerp(startTarget, 1-e*0.3));
    var fade = 1-e;
    sceneWrap.style.opacity = fade.toString();
    if(t<1){ requestAnimationFrame(step); }
    else { openArticle(idx); }
  }
  requestAnimationFrame(step);
}

function openArticle(idx){
  var n = nodes[idx].data;
  var c = cat(n.cat);
  articleColumn.innerHTML =
    '<div class="article-eyebrow" style="color:'+c.color+'">'+c.label+'</div>'+
    '<h1 class="article-title">'+n.title+'</h1>'+
    '<div class="article-meta">'+n.date+' &nbsp;·&nbsp; '+n.readTime+' min read</div>'+
    '<div class="article-body">'+n.body.map(function(p){ return '<p>'+p+'</p>'; }).join('')+'</div>';
  articleView.classList.add('visible');
  articleView.scrollTop = 0;
  sceneWrap.style.pointerEvents = 'none';
}

function closeArticle(){
  articleView.classList.remove('visible');
  sceneWrap.style.opacity = '1';
  sceneWrap.style.pointerEvents = 'auto';
  targetRig.theta = HOME.theta; targetRig.phi = HOME.phi; targetRig.radius = HOME.radius;
  setTimeout(function(){
    hint.style.opacity = '1';
    warping = false;
  }, 500);
}
backBtn.addEventListener('click', closeArticle);

/* ---------------------------------------------------------
   ANIMATE
--------------------------------------------------------- */
var clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  var dt = clock.getDelta();

  if(idleRotate && !warping){
    targetRig.theta += dt*SC.idleRotateSpeed;
  }
  rig.theta += (targetRig.theta-rig.theta)*SC.followEase;
  rig.phi   += (targetRig.phi-rig.phi)*SC.followEase;
  rig.radius+= (targetRig.radius-rig.radius)*SC.followEase;

  if(!warping){
    updateCameraFromRig();
  }

  starsFar.rotation.y += dt*CONFIG.starfield.driftSpeed;

  for(var si=shootingStars.length-1; si>=0; si--){
    var st = shootingStars[si];
    st.age += dt;
    var lifeFrac = st.age/st.lifetime;
    if(lifeFrac>=1){
      scene.remove(st.group);
      shootingStars.splice(si,1);
      continue;
    }
    st.group.position.addScaledVector(st.dir, st.speed*dt);
    var op;
    if(lifeFrac<0.12) op = lifeFrac/0.12;
    else if(lifeFrac>0.5) op = 1-((lifeFrac-0.5)/0.5);
    else op = 1;
    op = Math.max(0, Math.min(1, op));
    st.mat.opacity = op*CONFIG.shootingStar.lineOpacity;
    st.glowMat.opacity = op*CONFIG.shootingStar.glowOpacity;
  }

  /* hover raycast (skip while warping) */
  if(!warping){
    raycaster.setFromCamera(mouseNDC, camera);
    var coreMeshes = nodes.map(function(n){ return n.core; });
    var hits = raycaster.intersectObjects(coreMeshes);
    if(hits.length){
      var idx = coreMeshes.indexOf(hits[0].object);
      setHover(idx);
      hoveredEdge = null;
    } else {
      setHover(null);
      var lineObjs = edges.map(function(e){ return e.line; });
      var lineHits = raycaster.intersectObjects(lineObjs);
      hoveredEdge = lineHits.length ? lineObjs.indexOf(lineHits[0].object) : null;
    }
  }

  /* per-node visual state: hovered grows/brightens, connected lines glow, unrelated fade */
  var activeEdgeIdxs = hovered!==null ? (neighborEdges[hovered]||[]) : [];
  var edgeEndpoints = hoveredEdge!==null ? [edges[hoveredEdge].a, edges[hoveredEdge].b] : [];
  nodes.forEach(function(n, idx){
    var isHovered = idx===hovered;
    var isConnected = hovered!==null && activeEdgeIdxs.some(function(ei){ return edges[ei].a===idx || edges[ei].b===idx; });
    var isHalfLit = hoveredEdge!==null && edgeEndpoints.indexOf(idx)!==-1;
    var targetMultiplier = isHovered ? NC.hoverScaleMultiplier : 1;
    var targetOpacityCore = hovered===null ? NC.restOpacity : (isHovered ? NC.hoverOpacity : (isConnected ? NC.connectedOpacity : NC.dimmedOpacity));
    var targetGlowOp = n.baseGlowOpacity * (isHovered ? NC.hoverGlowMultiplier : (isHalfLit ? NC.halfLitGlowMultiplier : (hovered===null ? 1 : (isConnected ? NC.connectedGlowMultiplier : 0.3))));
    var targetRingOp = n.baseRingOpacity * (isHovered ? NC.hoverRingMultiplier : (isHalfLit ? NC.halfLitRingMultiplier : (hovered===null ? 1 : (isConnected ? NC.connectedRingMultiplier : 0.25))));

    var s = n.core.scale.x + (targetMultiplier - n.core.scale.x)*NC.easeSpeed;
    n.core.scale.setScalar(s);
    n.core.material.opacity += (targetOpacityCore - n.core.material.opacity)*NC.easeSpeed;

    n.glow.material.opacity += (targetGlowOp - n.glow.material.opacity)*NC.easeSpeed;
    var gs = n.baseGlowScale * (isHovered?1.5:1);
    var curGS = n.glow.scale.x;
    var newGS = curGS + (gs-curGS)*NC.easeSpeed;
    n.glow.scale.set(newGS,newGS,1);

    n.ring.material.opacity += (targetRingOp - n.ring.material.opacity)*NC.easeSpeed;
    var rs = n.baseRingScale * (isHovered?1.7:1);
    var curRS = n.ring.scale.x;
    var newRS = curRS + (rs-curRS)*NC.easeSpeed;
    n.ring.scale.set(newRS,newRS,1);
  });

  edges.forEach(function(e, ei){
    var isActive = hovered!==null && (e.a===hovered || e.b===hovered);
    var isDim = hovered!==null && !isActive;
    var isLineHovered = ei===hoveredEdge;
    var targetOp = isLineHovered ? EC.hoverLineOpacity : (isActive ? EC.hoverConnectedOpacity : (isDim ? EC.dimmedOpacity : EC.restOpacity));
    e.mat.opacity += (targetOp - e.mat.opacity)*EC.easeSpeed;
  });

  if(hovered!==null && !warping){
    positionPanel(hovered);
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

})();
</script>
</body>
</html>
